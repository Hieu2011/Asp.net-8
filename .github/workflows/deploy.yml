name: CD - Deploy
run-name: "🚀 Deploy ${{ github.ref_name == 'GIT/production' && 'PRODUCTION' || 'staging' }} · ${{ github.event.head_commit.message }}"

# Build image trên runner GitHub → push GHCR → gọi Coolify (app kiểu Docker Image) pull + rolling update.
# Dùng chung staging/production — chỉ khác nhánh, cú pháp commit và UUID app Coolify.
# Chỉ build app có thay đổi trong lần push: src/ + props → ApiCore8, frontend/ → frontend.
on:
  push:
    branches: ['GIT/staging', 'GIT/production']

permissions:
  contents: read

# Staging: push liên tiếp thì hủy run cũ. Production: không hủy giữa chừng.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'GIT/production' }}

env:
  DEPLOY_ENV: ${{ github.ref_name == 'GIT/production' && 'production' || 'staging' }}
  DEPLOY_KEYWORD: ${{ github.ref_name == 'GIT/production' && 'up pro' || 'up staging' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Check deploy syntax
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" != *"$DEPLOY_KEYWORD"* ]]; then
            echo "❌ KHÔNG deploy $DEPLOY_ENV — commit message thiếu cú pháp bắt buộc '$DEPLOY_KEYWORD'."
            echo "   Commit message: $COMMIT_MSG"
            exit 1
          fi
          echo "✅ Đúng cú pháp '$DEPLOY_KEYWORD' — deploy $DEPLOY_ENV."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Nhánh mới/force push không có commit trước → build hết
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          lstChanged=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          grep -qE '^(src/|Directory\.(Build|Packages)\.props)' <<< "$lstChanged" && strBackend=true || strBackend=false
          grep -qE '^(frontend/|Dockerfile\.frontend)' <<< "$lstChanged" && strFrontend=true || strFrontend=false
          echo "backend=$strBackend" >> "$GITHUB_OUTPUT"
          echo "frontend=$strFrontend" >> "$GITHUB_OUTPUT"
          echo "Backend thay đổi: $strBackend · Frontend thay đổi: $strFrontend"

  apicore8:
    needs: gate
    if: needs.gate.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # if: không đọc được secrets trực tiếp → quy ra cờ ở env
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: >
          dotnet publish src/ApiCore8/ApiCore8.Api/ApiCore8.Api.csproj -c Release
          --os linux --arch x64 -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerImageTags='"${{ github.sha }};${{ env.DEPLOY_ENV }}"'

      # Runner tạm join Tailscale (ephemeral, tag:ci) → gọi Coolify không phụ thuộc Cloudflare Tunnel (mạng công ty chặn)
      - name: Connect Tailscale
        id: tailscale
        if: env.HAS_TAILSCALE == 'true'
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ steps.tailscale.outcome == 'success' && secrets.COOLIFY_TAILSCALE_API_URL || 'https://coolify.hieupm.dev/api/v1' }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ github.ref_name == 'GIT/production' && secrets.COOLIFY_PROD_UUID || secrets.COOLIFY_STAGING_UUID }}
          IMAGE_TAG: ${{ github.sha }}
          APP_LABEL: ApiCore8 ${{ env.DEPLOY_ENV }}
        run: bash .github/scripts/coolify-deploy.sh

  frontend:
    needs: gate
    if: needs.gate.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* nhúng lúc build → lấy từ GitHub Variables (không phải secret, giá trị public)
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/hieu2011/frontend:${{ github.sha }}
            ghcr.io/hieu2011/frontend:${{ env.DEPLOY_ENV }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ github.ref_name == 'GIT/production' && vars.FE_SITE_URL_PROD || vars.FE_SITE_URL_STAGING }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.FE_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.FE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Connect Tailscale
        id: tailscale
        if: env.HAS_TAILSCALE == 'true'
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ steps.tailscale.outcome == 'success' && secrets.COOLIFY_TAILSCALE_API_URL || 'https://coolify.hieupm.dev/api/v1' }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ github.ref_name == 'GIT/production' && secrets.COOLIFY_FE_PROD_UUID || secrets.COOLIFY_FE_STAGING_UUID }}
          IMAGE_TAG: ${{ github.sha }}
          APP_LABEL: Frontend ${{ env.DEPLOY_ENV }}
        run: bash .github/scripts/coolify-deploy.sh
