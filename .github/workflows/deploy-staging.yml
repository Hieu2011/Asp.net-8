name: Deploy to Staging

# Y hệt deploy.yml (production) nhưng nghe nhánh GIT/staging + cụm từ "up staging" — dùng
# chung COOLIFY_API_TOKEN (token scope Root Team, gọi được mọi app), khác UUID app đích.
on:
  push:
    branches: ['GIT/staging']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy syntax
        run: |
          if [[ "${{ github.event.head_commit.message }}" != *"up staging"* ]]; then
            echo "❌ KHÔNG deploy — commit message thiếu cú pháp bắt buộc 'up staging'."
            echo "   Commit message: ${{ github.event.head_commit.message }}"
            exit 1
          fi
          echo "✅ Đúng cú pháp 'up staging' — tiến hành gọi Coolify deploy."

      - name: Trigger Coolify deploy
        run: |
          curl -f -X GET "https://coolify.hieupm.dev/api/v1/deploy?uuid=${{ secrets.COOLIFY_STAGING_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
