name: Deploy to Staging

# Build image trên runner GitHub → push GHCR (private) → Coolify (app kiểu Docker Image) chỉ pull + rolling update.
on:
  push:
    branches: ['GIT/staging']

permissions:
  contents: read

# Push liên tiếp thì hủy run cũ, chỉ deploy bản mới nhất
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check deploy syntax
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" != *"up staging"* ]]; then
            echo "❌ KHÔNG deploy — commit message thiếu cú pháp bắt buộc 'up staging'."
            echo "   Commit message: $COMMIT_MSG"
            exit 1
          fi
          echo "✅ Đúng cú pháp 'up staging'."

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: >
          dotnet publish src/ApiCore8/ApiCore8.Api/ApiCore8.Api.csproj -c Release
          --os linux --arch x64 -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerImageTags='"${{ github.sha }};staging"'

      # Ở mạng công ty Cloudflare Tunnel bị chặn → không gọi được Coolify: chỉ cảnh báo, image đã lên GHCR
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: |
          if curl -fsS -X GET "https://coolify.hieupm.dev/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" \
               -H "Authorization: Bearer ${COOLIFY_TOKEN}"; then
            echo "✅ Đã gọi Coolify deploy."
          else
            echo "::warning::Không gọi được Coolify — image đã lên GHCR, vào Coolify qua Tailscale bấm Redeploy."
          fi
