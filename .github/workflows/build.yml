name: Build

# Chỉ kiểm tra build ở main/PR — nhánh GIT/* đã có workflow deploy tự compile
on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ApiCore8.sln
        run: dotnet build src/ApiCore8/ApiCore8.sln --configuration Release

      - name: Build AuthService.sln
        run: dotnet build src/AuthService/AuthService.sln --configuration Release
