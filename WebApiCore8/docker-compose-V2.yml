version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - backend_net

  mongodb:
    image: mongo:6.0
    container_name: ${MONGO_HOST}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - backend_net

  redis:
    image: redis:7.0
    container_name: redis_server
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend_net

  webapi:
    image: webapi:${APP_VERSION}
    build:
      context: .
      dockerfile: ApiCore8/Dockerfile
    container_name: webapi_server
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: "http://+:${WEBAPI_INTERNAL_PORT}"
      TZ: ${TZ}
      # Database Connection
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # MongoDB
      Mongo__Connection: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:27017"
      Mongo__Database: ${MONGO_DB_NAME}
      # Redis
      Redis__Host: redis
      Redis__Port: 6379
      Redis__Password: ${REDIS_PASSWORD}
    depends_on:
      - postgres
      - mongodb
      - redis
    ports:
      - "${WEBAPI_PORT}:${WEBAPI_INTERNAL_PORT}"
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - webapi
    networks:
      - backend_net

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  backend_net:
    driver: bridge
