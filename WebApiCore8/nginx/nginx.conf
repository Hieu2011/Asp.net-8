events { }

http {
    # ✅ Chuyển hướng tất cả request HTTP sang HTTPS
    server {
        listen 80;
        server_name localhost;

        # Redirect tất cả sang HTTPS
        return 301 https://$host$request_uri;
    }

    # ✅ Server HTTPS (có chứng chỉ SSL tự ký)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Bảo mật cơ bản
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Giao tiếp tới Web API (.NET)
        location / {
            proxy_pass http://webapi:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Giữ kết nối tốt hơn cho API streaming / long requests
            proxy_read_timeout 120s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
        }

        # Tuỳ chọn: Log lỗi & truy cập
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}
